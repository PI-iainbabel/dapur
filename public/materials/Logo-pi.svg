<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Left wing of the Psikologi Islam Psi symbol -->
    <path id="pi-wing-left" d="
      M 48.5,75 
      C 34,75 22,65 22,46
      C 22,32 28,21 34,17
      C 36,15 37.5,17 36.5,19
      C 31,27 28,37 30,47
      C 32,57 39,63 48.5,64
      M 48.5,47
      C 37,47 28,54 28,62
      C 28,70 37,73 48.5,73
    " fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </defs>

  <!-- Circular navy blue badge -->
  <circle cx="50" cy="50" r="48" fill="#152c54" />
  
  <!-- Concentric inner white ring border -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- 5-pointed Islamic Star -->
  <polygon points="50,13.5 51.6,17.2 55.6,17.4 52.4,19.9 53.6,23.8 50,21.4 46.4,23.8 47.6,19.9 44.4,17.4 48.4,17.2" fill="#FFFFFF" />

  <!-- Central Vertical Pillar / Shaft -->
  <path d="M 48.8,26.5 L 51.2,26.5 L 51.2,78 L 48.8,78 Z" fill="#FFFFFF" />
  
  <!-- Base Pedestal -->
  <path d="M 42,82.5 L 58,82.5 C 55.5,82.5 53.5,80.5 52.5,78 L 47.5,78 C 46.5,80.5 44.5,82.5 42,82.5 Z" fill="#FFFFFF" />

  <!-- Left Symmetrical Wing -->
  <use href="#pi-wing-left" />

  <!-- Right Symmetrical Wing (Mirrored) -->
  <use href="#pi-wing-left" transform="scale(-1, 1) translate(-100, 0)" />
</svg>
